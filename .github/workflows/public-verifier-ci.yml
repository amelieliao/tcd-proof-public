name: Public verifier CI

on:
  push:
  pull_request:

jobs:
  public-verifier:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: pytest

      - name: Build package wheel
        run: python -m pip wheel --no-deps . -w /tmp/tcd-proof-public-wheelhouse

      - name: Valid Ed25519 fixture succeeds
        run: |
          python -m tcd_verifier verify \
            --receipt fixtures/verifier_v0_1/valid/receipt.json \
            --public-key fixtures/verifier_v0_1/valid/public-key.pem \
            --expected fixtures/verifier_v0_1/valid/expected-bindings.json

      - name: Tampered Ed25519 fixture fails
        run: |
          if python -m tcd_verifier verify \
            --receipt fixtures/verifier_v0_1/tampered_receipt/receipt.json \
            --public-key fixtures/verifier_v0_1/tampered_receipt/public-key.pem \
            --expected fixtures/verifier_v0_1/tampered_receipt/expected-bindings.json; then
            echo "tampered fixture unexpectedly succeeded"
            exit 1
          fi

      - name: Wrong expected policy fails
        run: |
          if python -m tcd_verifier verify \
            --receipt fixtures/verifier_v0_1/wrong_policy/receipt.json \
            --public-key fixtures/verifier_v0_1/wrong_policy/public-key.pem \
            --expected fixtures/verifier_v0_1/wrong_policy/expected-bindings.json; then
            echo "wrong-policy fixture unexpectedly succeeded"
            exit 1
          fi

      - name: Wrong expected build fails
        run: |
          if python -m tcd_verifier verify \
            --receipt fixtures/verifier_v0_1/wrong_build/receipt.json \
            --public-key fixtures/verifier_v0_1/wrong_build/public-key.pem \
            --expected fixtures/verifier_v0_1/wrong_build/expected-bindings.json; then
            echo "wrong-build fixture unexpectedly succeeded"
            exit 1
          fi

      - name: Missing required field fails
        run: |
          if python -m tcd_verifier verify \
            --receipt fixtures/verifier_v0_1/missing_required_field/receipt.json \
            --public-key fixtures/verifier_v0_1/missing_required_field/public-key.pem \
            --expected fixtures/verifier_v0_1/missing_required_field/expected-bindings.json; then
            echo "missing-field fixture unexpectedly succeeded"
            exit 1
          fi

      - name: Unsupported algorithm fails
        run: |
          if python -m tcd_verifier verify \
            --receipt fixtures/verifier_v0_1/unsupported_algorithm/receipt.json \
            --public-key fixtures/verifier_v0_1/unsupported_algorithm/public-key.pem \
            --expected fixtures/verifier_v0_1/unsupported_algorithm/expected-bindings.json; then
            echo "unsupported-algorithm fixture unexpectedly succeeded"
            exit 1
          fi

      - name: Complete reconciliation succeeds
        run: |
          python -m tcd_verifier reconcile \
            --eligible-actions fixtures/reconciliation/complete/eligible-actions.json \
            --receipt-index fixtures/reconciliation/complete/receipt-index.json \
            --verification-results fixtures/reconciliation/complete/verification-results.json

      - name: Missing receipt reconciliation fails
        run: |
          if python -m tcd_verifier reconcile \
            --eligible-actions fixtures/reconciliation/missing-receipt/eligible-actions.json \
            --receipt-index fixtures/reconciliation/missing-receipt/receipt-index.json \
            --verification-results fixtures/reconciliation/missing-receipt/verification-results.json; then
            echo "missing-receipt reconciliation unexpectedly succeeded"
            exit 1
          fi

      - name: Duplicate receipt reconciliation fails
        run: |
          if python -m tcd_verifier reconcile \
            --eligible-actions fixtures/reconciliation/duplicate-receipt/eligible-actions.json \
            --receipt-index fixtures/reconciliation/duplicate-receipt/receipt-index.json \
            --verification-results fixtures/reconciliation/duplicate-receipt/verification-results.json; then
            echo "duplicate-receipt reconciliation unexpectedly succeeded"
            exit 1
          fi

      - name: Orphan receipt reconciliation fails
        run: |
          if python -m tcd_verifier reconcile \
            --eligible-actions fixtures/reconciliation/orphan-receipt/eligible-actions.json \
            --receipt-index fixtures/reconciliation/orphan-receipt/receipt-index.json \
            --verification-results fixtures/reconciliation/orphan-receipt/verification-results.json; then
            echo "orphan-receipt reconciliation unexpectedly succeeded"
            exit 1
          fi

      - name: Verification failure reconciliation fails
        run: |
          if python -m tcd_verifier reconcile \
            --eligible-actions fixtures/reconciliation/verification-failure/eligible-actions.json \
            --receipt-index fixtures/reconciliation/verification-failure/receipt-index.json \
            --verification-results fixtures/reconciliation/verification-failure/verification-results.json; then
            echo "verification-failure reconciliation unexpectedly succeeded"
            exit 1
          fi

      - name: Uncommitted receipt reconciliation fails
        run: |
          if python -m tcd_verifier reconcile \
            --eligible-actions fixtures/reconciliation/uncommitted-receipt/eligible-actions.json \
            --receipt-index fixtures/reconciliation/uncommitted-receipt/receipt-index.json \
            --verification-results fixtures/reconciliation/uncommitted-receipt/verification-results.json; then
            echo "uncommitted-receipt reconciliation unexpectedly succeeded"
            exit 1
          fi

      - name: Verify test-vector manifest
        run: python -m tcd_verifier manifest-check --manifest fixtures/verifier_v0_1/test-vector-manifest.json

      - name: Verify bundle manifest
        run: python -m tcd_verifier manifest-check --manifest fixtures/test-vector-bundle-manifest.json

      - name: AML/KYB public export validator
        run: python3 demos/aml_kyb_alert_review/tools/validate_public_export.py --demo-root demos/aml_kyb_alert_review

      - name: AML/KYB public demo acceptance gate
        run: python3 demos/aml_kyb_alert_review/tools/check_demo_acceptance.py --public-root .
